# The add-on's real image on a development machine, against a household that
# does not exist -- the panel renders person and zone ids verbatim, so captures
# are taken against a generated household. Same base, same pins, same committed
# panel bundle as the thing Supervisor builds. Commands: docs/demo-instance.md.
#
#     cp .env.example .env && docker compose run --rm instance build --out /data

x-addon: &addon
  image: occupancy-forecast:demo
  build:
    context: ./occupancy-forecast-edge
    args:
      # Supervisor normally fills BUILD_FROM from build.yaml; there is none here.
      # amd64 only -- a development box, not the store's multi-arch build.
      BUILD_FROM: ghcr.io/home-assistant/amd64-base-debian:trixie

  # The HA base sets ENTRYPOINT ["/init"] and CMD is /run.sh, a bashio script
  # that reads options out of a Supervisor that does not exist here.
  entrypoint: []

  environment:
    # `/app` is the WORKDIR but not sys.path[0]: these scripts are invoked by
    # absolute path from the read-only mount below.
    PYTHONPATH: /app
    TZ: ${TZ:-Etc/UTC}
    # No OMP_NUM_THREADS pin: `fit` is a joblib fan-out and the container sees the
    # host's CPU count, so pinning inner threads multiplies the two. `--n-jobs` is the knob.

  # So everything written into the bind-mounted /data is owned by the user who will read and delete it.
  user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"

  volumes:
    - ./scripts:/scripts:ro
    # The real path: `config.DATA_DIR` is `/data` and modules snapshot paths
    # from it at import time.
    - ${DEMO_DATA:-./demo-data}:/data

services:
  # The panel, served from whatever is in /data. No Home Assistant, no broker.
  demo:
    <<: *addon
    command: ["python", "/scripts/demo-serve.py", "--data", "/data", "--port", "8099"]
    ports:
      # 8099 inside because that is the add-on's port; outside defaults to 8100,
      # since a dev box often has 8099 taken.
      - "${DEMO_BIND:-127.0.0.1}:${DEMO_PORT:-8100}:8099"
    healthcheck:
      # The add-on's own liveness route, via python: the base image carries no curl.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Build and fit the fictional household. One-shot, behind a profile. `fit` and
  # `forecasts` run the REAL pipeline, so only the household is invented.
  instance:
    <<: *addon
    entrypoint: ["python", "/scripts/demo-instance.py"]
    profiles: ["tools"]

  # Screenshots, light and dark, desktop and mobile, all three tabs.
  capture:
    image: occupancy-forecast:capture
    build:
      # Any small directory: nothing is COPYed, and `.` would ship the whole repository to the daemon.
      context: ./scripts
      dockerfile_inline: |
        # `playwright/python` is the image with the BROWSERS but not the Python
        # package; the plain `playwright` tag is the Node one. Pin the package to
        # the tag -- a mismatch reads as "Executable doesn't exist".
        FROM mcr.microsoft.com/playwright/python:v1.56.0-noble
        RUN pip install --no-cache-dir playwright==1.56.0
    profiles: ["tools"]
    user: "${DEMO_UID:-1000}:${DEMO_GID:-1000}"
    environment:
      # Chromium wants somewhere writable to call home.
      HOME: /tmp
    # Chromium exhausts a container's default /dev/shm on a full-page screenshot.
    ipc: host
    volumes:
      - ./scripts:/scripts:ro
      - ${SHOTS_DIR:-./demo-shots}:/shots
    depends_on:
      demo:
        condition: service_healthy
    command: ["python", "/scripts/demo-capture.py",
              "--url", "http://demo:8099", "--out", "/shots", "--no-sandbox"]
