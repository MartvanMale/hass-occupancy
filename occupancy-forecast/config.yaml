# The stable build. This file, DOCS.md and CHANGELOG.md are hand-written; every
# other file here is GENERATED from ../occupancy-forecast-edge by promote.sh, and
# an edit to one of those is destroyed by the next promotion. Edit the originals.
#
# `version` moves only on a promotion -- that bump is what offers the update to
# everyone installed from this repository.
name: Occupancy Forecast
version: "0.2.0"
slug: occupancy_forecast
description: >-
  Forecasts who will be home, hour by hour, for the next two days -- and how
  many minutes until someone actually arrives.
url: https://github.com/MartvanMale/hass-occupancy
license: MIT
arch:
  # scikit-learn has no armv7 wheels worth waiting for; better to say so than to
  # ship an add-on that takes forty minutes to install and then fails.
  - aarch64
  - amd64
init: false

# Ingress rather than a mapped port: Home Assistant proxies the configuration
# page into the sidebar, authenticated, with nothing extra exposed on the LAN.
ingress: true
ingress_port: 8099
panel_icon: mdi:home-clock-outline
panel_title: Occupancy

# Supervisor injects the broker's host, port and credentials, so the user never
# types them and there is no host default to get wrong.
#
# `want`, not `need`: without a broker the add-on still collects history, still
# trains and still answers its API -- it just cannot publish entities, and
# run.sh says so in the log. `need` would refuse to start at all, which is a
# worse answer for somebody who has not set up MQTT yet.
services:
  - mqtt:want

# Reads history, states and config. Not read-only: it also calls exactly one
# service, persistent_notification create/dismiss, for its own progress notice.
homeassistant_api: true

options:
  log_level: info
  source: store
  admin_users: []
  influx_url: ""
  influx_org: ""
  influx_bucket: homeassistant
  influx_token: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  # `store` accumulates its own history from Home Assistant and works anywhere.
  # `influx` is for installs that already archive HA and would otherwise throw
  # months of history away and start again from ten days.
  source: list(store|influx)
  # HA user ids allowed to POST (save config, train, reload). EMPTY MEANS
  # EVERYONE: ingress proves who the caller is, not whether they may retrain
  # the house.
  admin_users:
    - str
  influx_url: str?
  influx_org: str?
  influx_bucket: str?
  influx_token: password?
