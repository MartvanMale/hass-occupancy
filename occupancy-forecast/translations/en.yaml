# What the Configuration tab shows beside each option. Without this file it
# shows the raw keys and nothing else.
configuration:
  log_level:
    name: Log level
    description: >-
      How much the add-on writes to its log. `info` logs transitions and one
      heartbeat an hour; `debug` adds a line per five-minute cycle.
  source:
    name: History source
    description: >-
      Where training history comes from. `store` keeps its own archive under
      /data from the moment the add-on is installed. `influx` reads an
      InfluxDB v2 bucket that Home Assistant's InfluxDB integration already
      fills, and trains from it immediately.
  admin_users:
    name: Admin users
    description: >-
      Home Assistant user ids allowed to save the configuration, retrain and
      reload. Empty means every user who can open the panel.
  influx_url:
    name: InfluxDB URL
    description: Only read when the source is `influx`.
  influx_org:
    name: InfluxDB organisation
    description: Only read when the source is `influx`.
  influx_bucket:
    name: InfluxDB bucket
    description: The bucket Home Assistant's InfluxDB integration writes to.
  influx_token:
    name: InfluxDB token
    description: >-
      A read-only token scoped to that bucket. The add-on only ever queries;
      it never writes to InfluxDB.
  mqtt_host:
    name: MQTT broker host
    description: >-
      Only for a broker that is not a Supervisor add-on -- EMQX, or Mosquitto
      on another machine. Set it and these five win over the Mosquitto add-on;
      leave it empty and that add-on is used as before.
  mqtt_port:
    name: MQTT broker port
    description: Only read when a broker host is set.
  mqtt_user:
    name: MQTT username
    description: Only read when a broker host is set.
  mqtt_password:
    name: MQTT password
    description: Only read when a broker host is set.
  mqtt_ssl:
    name: MQTT over TLS
    description: Only read when a broker host is set.
