# The development build, and THE SOURCE OF TRUTH for this repository. Every code
# change is made here; ../occupancy-forecast is generated from this directory by
# scripts/promote.sh when a change has earned its way into the stable add-on.
#
# `version` is the stable release this work is heading toward, suffixed `-dev`.
# It is documentation, not a mechanism: these are local add-ons, so
# scripts/deploy-edge.sh rebuilds on demand and does not need a bump. That
# script stamps the deployed copy with the commit sha; this file keeps the plain
# string so that every commit does not carry a version diff.
#
# This is installable ALONGSIDE the stable add-on. They keep apart automatically
# because the MQTT topic root, client id and Home Assistant device names are all
# derived from the add-on's own slug (see occupancy_forecast/config.py, topic_prefix),
# so this one owns `occupancy_forecast_edge/*` and `sensor.occupancy_forecast_edge_*` while
# stable owns `occupancy_forecast/*`. There is nothing to configure. If the slug
# cannot be read from Supervisor the add-on logs a warning and falls back to
# stable's prefix -- which is a collision, so do not ignore that line.
name: Occupancy Forecast Edge
version: "0.2.0-dev"
slug: occupancy_forecast_edge
description: >-
  Development build of the Occupancy Forecast app. Runs alongside the stable one with
  its own entities, so you can compare them before promoting.
url: https://github.com/MartvanMale/hass-occupancy
license: MIT
arch:
  - aarch64
  - amd64
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:home-clock-outline
panel_title: Occupancy Edge

services:
  - mqtt:want

homeassistant_api: true

options:
  log_level: info
  source: store
  influx_url: ""
  influx_org: ""
  influx_bucket: homeassistant
  influx_token: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  source: list(store|influx)
  influx_url: str?
  influx_org: str?
  influx_bucket: str?
  influx_token: password?
