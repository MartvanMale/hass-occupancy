# The development build. See DEVELOPMENT.md for how this tree relates to
# ../occupancy-forecast and how each is deployed. `version` stays the plain
# `-dev` string: deploy-edge.sh stamps the DEPLOYED copy with the commit sha.
# A slug that cannot be read falls back to stable's prefix -- a silent MQTT collision.
name: Occupancy Forecast Edge
version: "0.3.2-dev"
slug: occupancy_forecast_edge
description: >-
  Development build of the Occupancy Forecast app. Runs alongside the stable one with
  its own entities, so you can compare them before promoting.
url: https://github.com/MartvanMale/hass-occupancy
license: MIT
arch:
  - aarch64
  - amd64
init: false

ingress: true
ingress_port: 8099
panel_icon: mdi:home-clock-outline
panel_title: Occupancy Edge

# The development build of a public repository: shown only to users who have
# switched advanced mode on, and badged as experimental where it is shown.
advanced: true
stage: experimental

# Supervisor restarts on a non-2xx; /health returns 503 while the worker is stalled.
watchdog: "http://[HOST]:[PORT:8099]/health"

services:
  - mqtt:want

# Reads history, states and config. Not read-only: it also calls exactly one
# service, persistent_notification create/dismiss, for its own progress notice.
homeassistant_api: true

options:
  log_level: info
  source: store
  admin_users: []
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  mqtt_ssl: false
  influx_url: ""
  influx_org: ""
  influx_bucket: homeassistant
  influx_token: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  source: list(store|influx)
  # EMPTY MEANS EVERYONE: ingress proves who the caller is, not whether they may retrain the house.
  admin_users:
    - str
  # `str?`, not `url?`: the default is "" and Supervisor's url validator rejects
  # an empty string.
  influx_url: str?
  influx_org: str?
  influx_bucket: str?
  influx_token: password?
  # A broker that is not a Supervisor add-on registers no service; set mqtt_host
  # and these five win.
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  mqtt_ssl: bool?
