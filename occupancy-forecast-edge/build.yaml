# Debian, not the Home Assistant Python base, which is Alpine/musl:
# scikit-learn has published ZERO musllinux wheels as a matter of project
# policy, so pip would compile it from source. On Debian every dependency has a
# manylinux wheel. trixie ships python3 3.13, which this package targets.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:trixie
  amd64: ghcr.io/home-assistant/amd64-base-debian:trixie
